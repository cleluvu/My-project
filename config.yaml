behaviors:
  MyAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 5000
      learning_rate: 3.0e-4
      beta: 0.01
    network_settings:
      num_layers: 2
      hidden_units: 128
    reward_signals:
      extrinsic:
        gamma: 0.99
    max_steps: 500000
    summary_freq: 5000
    